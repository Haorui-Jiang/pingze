<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>平仄格律查询 · 智谱 GLM-5.2</title>
<style>
  :root {
    --ink: #2b2b2b;
    --ink-soft: #5a534b;
    --seal: #9e2f2f;
    --seal-soft: #c0564f;
    --paper: #f5efe3;
    --paper-2: #efe7d6;
    --line: #d8cdb8;
    --gold: #b08d3e;
    --ping: #2f7d56;
    --ze: #a4322c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "KaiTi", "STKaiti", "楷体", "Songti SC", serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(158,47,47,0.05), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(176,141,62,0.06), transparent 40%),
      linear-gradient(135deg, var(--paper), var(--paper-2));
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.8;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 28px; }
  header .seal {
    display: inline-block; font-size: 13px; letter-spacing: 4px;
    color: #fff; background: var(--seal); padding: 4px 14px;
    border-radius: 4px; transform: rotate(-2deg);
    box-shadow: 0 2px 8px rgba(158,47,47,0.25);
  }
  header h1 {
    font-size: 40px; letter-spacing: 10px; margin: 14px 0 6px;
    font-weight: 700; color: var(--ink);
    text-shadow: 0 2px 0 rgba(255,255,255,0.6);
  }
  header .sub { color: var(--ink-soft); font-size: 15px; letter-spacing: 2px; }

  .card {
    background: rgba(255,253,248,0.82);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px 28px;
    margin-bottom: 22px;
    box-shadow: 0 8px 30px rgba(120,100,70,0.10);
    backdrop-filter: blur(6px);
  }
  .card h2 {
    font-size: 19px; letter-spacing: 3px; color: var(--seal);
    margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
  }
  .card h2::before {
    content: "❖"; font-size: 14px; color: var(--gold);
  }

  label { display: block; font-size: 14px; color: var(--ink-soft); margin-bottom: 8px; letter-spacing: 1px; }
  textarea, select, input {
    width: 100%; font-family: inherit; font-size: 16px; color: var(--ink);
    background: #fffdf8; border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  textarea { min-height: 150px; resize: vertical; line-height: 1.9; letter-spacing: 1px; }
  textarea:focus, select:focus, input:focus { border-color: var(--seal-soft); box-shadow: 0 0 0 3px rgba(192,86,79,0.12); }

  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 200px; }

  .btn {
    font-family: inherit; font-size: 17px; letter-spacing: 4px;
    color: #fff; background: linear-gradient(135deg, var(--seal), var(--seal-soft));
    border: none; border-radius: 10px; padding: 14px 28px; cursor: pointer;
    transition: transform .15s, box-shadow .15s, opacity .15s;
    box-shadow: 0 6px 18px rgba(158,47,47,0.28);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(158,47,47,0.34); }
  .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }

  .hint { font-size: 13px; color: var(--ink-soft); margin-top: 10px; }
  .hint code { background: var(--paper-2); padding: 1px 6px; border-radius: 4px; font-family: monospace; }

  /* 结果区 */
  #result { display: none; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin: 6px 0 18px; }
  .meta {
    background: #fffdf8; border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; text-align: center;
  }
  .meta .k { font-size: 12px; color: var(--ink-soft); letter-spacing: 2px; }
  .meta .v { font-size: 22px; color: var(--seal); margin-top: 6px; letter-spacing: 2px; }

  .grid-title { font-size: 15px; color: var(--ink-soft); letter-spacing: 2px; margin: 8px 0 12px; }
  .pz-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .pz-cell {
    width: 56px; height: 56px; border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid var(--line); background: #fffdf8;
    transition: transform .12s;
  }
  .pz-cell:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(120,100,70,0.14); }
  .pz-cell .ch { font-size: 24px; line-height: 1; }
  .pz-cell .tone { font-size: 12px; margin-top: 4px; letter-spacing: 1px; }
  .pz-cell.ping { color: var(--ping); border-color: rgba(47,125,86,0.4); }
  .pz-cell.ze  { color: var(--ze); }
  .pz-cell.flag { color: var(--gold); }
  .pz-cell .punct { color: var(--ink-soft); }

  .yunbu { font-size: 15px; line-height: 2; color: var(--ink); }
  .yunbu b { color: var(--seal); }

  .note {
    margin-top: 14px; padding: 14px 16px; border-left: 3px solid var(--seal);
    background: var(--paper-2); border-radius: 0 8px 8px 0; font-size: 15px;
  }

  .copy-bar { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
  .copy-bar textarea {
    flex: 1; min-height: 38px; font-size: 13px; font-family: monospace;
    color: var(--ink-soft); padding: 8px 10px;
  }
  .mini-btn {
    font-family: inherit; font-size: 14px; letter-spacing: 2px; color: var(--seal);
    background: #fffdf8; border: 1px solid var(--seal-soft); border-radius: 8px;
    padding: 8px 18px; cursor: pointer; transition: background .15s;
  }
  .mini-btn:hover { background: rgba(192,86,79,0.10); }

  .err {
    border: 1px solid var(--ze); background: #fbeae9; color: var(--ze);
    border-radius: 10px; padding: 16px 18px; font-size: 15px;
  }
  .err b { letter-spacing: 1px; }

  .loading { text-align: center; color: var(--ink-soft); padding: 30px; letter-spacing: 2px; }
  .loading .dots::after { content: "·"; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0%{content:"";} 25%{content:"·";} 50%{content:"··";} 75%{content:"···";} 100%{content:"····";} }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 14px;
    border: 3px solid var(--line); border-top-color: var(--seal);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-text { font-size: 16px; letter-spacing: 2px; color: var(--seal); }

  footer { text-align: center; color: var(--ink-soft); font-size: 13px; letter-spacing: 1px; margin-top: 8px; }
  footer code { font-family: monospace; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>平仄格律查询</h1>
    <div class="sub">智谱 GLM-5.2 · 逐字标注 · 文体判定 · 韵部溯源</div>
  </header>

  <div class="card">
    <h2>录入</h2>
    <div class="row">
      <div style="flex:2">
        <label>诗词 / 对联文本</label>
        <textarea id="poem" placeholder="在此粘贴你的诗句，例如：&#10;白日依山尽，黄河入海流。&#10;欲穷千里目，更上一层楼。"></textarea>
      </div>
      <div style="flex:1">
        <label>智谱 API Key</label>
        <input id="apiKey" type="password" placeholder="粘贴你的智谱 API Key（glm-5.2 调用凭证）" />
        <button class="btn" id="go" style="width:100%;margin-top:14px;" onclick="analyze()">分　析</button>
      </div>
    </div>
  </div>

  <div id="progressBox" class="loading" style="display:none">
    <div class="spinner"></div>
    <div class="progress-text" id="progressText"></div>
  </div>

  <div id="result" class="card" style="display:none">
    <h2>格律分析</h2>
    <div class="meta-grid" id="metaGrid"></div>

    <div class="grid-title">逐字平仄</div>
    <div class="pz-grid" id="pzGrid"></div>

    <div class="grid-title">韵部溯源</div>
    <div class="yunbu" id="yunbu"></div>

    <div class="note" id="note"></div>

    <div class="copy-bar">
      <textarea id="copyText" readonly></textarea>
      <button class="mini-btn" onclick="copyResult()">复制全部</button>
    </div>
  </div>

  <div id="errorBox"></div>

  <footer>
    仿 <code>www.zhgc.com/pz/pz.asp</code> 功能 · 以大模型替代逐字字典查表
  </footer>
</div>

<script>
async function analyze() {
  const text = document.getElementById('poem').value;
  const apiKey = document.getElementById('apiKey').value.trim();
  const btn = document.getElementById('go');
  const errBox = document.getElementById('errorBox');
  const resBox = document.getElementById('result');

  errBox.innerHTML = '';
  if (!text.trim()) {
    showError('请先在上方粘贴要分析的诗词文本。');
    return;
  }
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = '分析中…';
  startProgress();

  try {
    const r = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body:JSON.stringify({ text, apiKey }),
    });
    const data = await r.json();
    stopProgress();
    if (data.error) { showError(data.error); return; }
    render(data);
  } catch (e) {
    stopProgress();
    showError('调用失败：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
}

function showError(msg) {
  document.getElementById('result').style.display = 'none';
  document.getElementById('errorBox').innerHTML =
    '<div class="err"><b>分析未完成</b><br>' + msg + '</div>';
}

function render(d) {
  document.getElementById('errorBox').innerHTML = '';
  const res = document.getElementById('result');
  res.style.display = 'block';

  // 元信息卡
  const meta = document.getElementById('metaGrid');
  meta.innerHTML = `
    <div class="meta"><div class="k">文　体</div><div class="v">${esc(d.form || '—')}</div></div>
    <div class="meta"><div class="k">总字数</div><div class="v">${(d.chars || []).length}</div></div>
    <div class="meta"><div class="k">平 / 仄</div><div class="v">${countTone(d.chars,'平')} / ${countTone(d.chars,'仄')}</div></div>
  `;

  // 逐字平仄网格
  const grid = document.getElementById('pzGrid');
  grid.innerHTML = (d.chars || []).map(c => {
    const t = c.tone;
    const cls = t === '平' ? 'ping' : t === '仄' ? 'ze' : (t === '—' ? 'punct' : 'flag');
    const label = t === '—' ? '符' : (t === '通' ? '通' : t);
    return `<div class="pz-cell ${cls}"><div class="ch">${esc(c.char)}</div><div class="tone">${label}</div></div>`;
  }).join('');

  // 韵部
  document.getElementById('yunbu').innerHTML =
    '<b>所属韵部：</b>' + (d.yunbu && d.yunbu.length ? d.yunbu.join('、') : '—');

  // 点评
  document.getElementById('note').textContent = '格律点评：' + (d.note || '—');

  // 复制文本
  document.getElementById('copyText').value = buildCopy(d);
}

function countTone(chars, t) {
  return (chars || []).filter(c => c.tone === t).length;
}

function buildCopy(d) {
  const lines = ['【逐字平仄】'];
  (d.chars || []).forEach(c => {
    lines.push(`${c.char}（${c.tone}）`);
  });
  lines.push('【文体】' + (d.form || '—'));
  lines.push('【韵部】' + (d.yunbu && d.yunbu.length ? d.yunbu.join('、') : '—'));
  lines.push('【点评】' + (d.note || '—'));
  return lines.join('\n');
}

function copyResult() {
  const t = document.getElementById('copyText').value;
  navigator.clipboard.writeText(t).then(() => {
    const b = document.querySelector('.mini-btn');
    const old = b.textContent;
    b.textContent = '已复制 ✓';
    setTimeout(() => (b.textContent = old), 1400);
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

let _progTimer = null;
const _STEPS = [
  '正在调用大模型 GLM-5.2，已发起请求…',
  '正在分析文本，逐字标注平仄…',
  '正在判定文体与韵部归属…',
  '正在整理结构化结果，即将呈现…'
];
let _stepIdx = 0;
function startProgress() {
  const box = document.getElementById('progressBox');
  const el = document.getElementById('progressText');
  box.style.display = 'block';
  el.textContent = _STEPS[0];
  _stepIdx = 0;
  _progTimer = setInterval(() => {
    _stepIdx = (_stepIdx + 1) % _STEPS.length;
    el.textContent = _STEPS[_stepIdx];
  }, 1400);
}
function stopProgress() {
  clearInterval(_progTimer);
  document.getElementById('progressBox').style.display = 'none';
}
</script>
</body>
</html>
