[build]
  # 静态站点根目录（含 index.html 等前端资源）
  publish = "结果"
  # Netlify Function 所在目录
  functions = "netlify/functions"
  # 唯一的构建步骤：把 Netlify 环境变量里的 Supabase 配置写进 结果/supabase-config.js。
  # 这个文件含真实的 Project URL 与 anon key，被 .gitignore 排除、不进仓库，
  # 因此每次构建都必须现场生成 —— 否则线上该文件 404，前端降级为
  # 「账号功能未启用」（见 tools/gen-supabase-config.js）。
  # 环境变量缺失或校验不过时脚本会 exit 1，让构建直接失败，而不是静默产出空配置。
  command = "node scripts/gen-supabase-config.js"

[build.environment]
  # 函数运行时的 Node 版本（fetch 为 Node 18+ 内置，无需任何 npm 依赖）
  NODE_VERSION = "20"

# 函数超时（秒）。免费版硬上限 10s；Pro 及以上可到 26s。
# 注意：`functions.timeout` 必须是「每个函数一项」的对象，不能写成标量，
# 否则 Netlify 解析 netlify.toml 时会直接报
# "Configuration property functions.timeout must be an object" 而拒绝部署。
[functions.analyze]
  timeout = 10
[functions.register]
  timeout = 10
[functions.admin-users]
  timeout = 10
[functions.admin-set-tier]
  timeout = 10

# 将前端请求的 /api/analyze 映射到 Serverless 函数 analyze
# 实际调用路径：/.netlify/functions/analyze
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 后台管理页：/admin 映射到静态文件 admin.html（publish 目录下）
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
