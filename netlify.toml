[build]
  # 静态站点根目录（含 index.html 等前端资源）
  publish = "结果"
  # Netlify Function 所在目录
  functions = "netlify/functions"
  # 唯一的构建步骤：把 Netlify 环境变量里的 Supabase 配置写进 结果/supabase-config.js。
  # 这个文件含真实的 Project URL 与 anon key，被 .gitignore 排除、不进仓库，
  # 因此每次构建都必须现场生成 —— 否则线上该文件 404，前端降级为
  # 「账号功能未启用」（见 tools/gen-supabase-config.js）。
  # 环境变量缺失或校验不过时脚本会 exit 1，让构建直接失败，而不是静默产出空配置。
  command = "node scripts/gen-supabase-config.js"

[build.environment]
  # 函数运行时的 Node 版本（fetch 为 Node 18+ 内置，无需任何 npm 依赖）
  NODE_VERSION = "20"

# 函数超时（秒）。免费版硬上限 10s；Pro 及以上可到 26s。
# 注意：`functions.timeout` 必须是「每个函数一项」的对象，不能写成标量，
# 否则 Netlify 解析 netlify.toml 时会直接报
# "Configuration property functions.timeout must be an object" 而拒绝部署。
# analyze 已于 V5 删除（平仄查询改浏览器本地查表）；ai-insight 是唯一的 AI 入口。
[functions.ai-insight]
  timeout = 10
[functions.admin-users]
  timeout = 10
[functions.admin-set-tier]
  timeout = 10

# 将前端请求的 /api/* 映射到 Serverless 函数（/:splat 即函数名）
# 实际调用路径：/.netlify/functions/<函数名>
# V5 起 /api/analyze 已不存在；AI 赏析走 /api/ai-insight。
# 注册也**不走这里**（2026-10-16）：前端直接用 Supabase SDK 的 signUp，
# 由 Supabase 发验证邮件；原先由后端代建号的 /api/register 已下线。
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 后台管理页：/admin 映射到静态文件 admin.html（publish 目录下）
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# 平水韵查询页：/pingshui-yun 映射到 pingshui-yun.html。
# 站点已关闭 Pretty URLs，/pingshui-yun/ 这类目录式地址不会自动找 index，只能走重定向。
# 与 server.local.js 的 STATIC_ROUTES 必须成对维护，否则本地能开、线上 404。
[[redirects]]
  from = "/pingshui-yun"
  to = "/pingshui-yun.html"
  status = 200

# =====================================================================
#  安全响应头（2026-10-16 上线前安全审查 P2-1）
#
#  实测修复前线上只有 HSTS，缺下面这些。每一项的作用：
#    · X-Frame-Options      防点击劫持。/admin 尤其重要 —— 它是能改会员等级的
#                          操作页，被 iframe 嵌套 + 诱导点击即可在管理员不知情
#                          下触发操作。
#    · X-Content-Type-Options  禁 MIME 嗅探，防止把非 HTML 响应当脚本执行。
#    · Referrer-Policy       不把站内 URL 带出到第三方。
#    · Permissions-Policy    关掉本站用不到的敏感能力（摄像头/麦克风/地理位置等），
#                          减少供应链攻击的可利用面。
#    · Content-Security-Policy  见下方说明，**当前是宽松版**。
#    · Strict-Transport-Security 由 Netlify 默认已下发（max-age=31536000），
#      这里不重复设置，避免与平台行为不一致。
#
#  CSP 为什么是宽松版：站点现有页面有较多内联 <script> 与内联事件处理器，
#  一次性改成只允许 external 会直接白屏。宽松版先拿到
#  「禁止外部资源注入（base-uri/form-action/object-src）+ 禁止内联 eval」
#  这些**零改造就能生效**的收益；后续把内联脚本外置后再逐步加严
#  （去掉 'unsafe-inline'）。改 CSP 前务必本地与线上双验。
#  ★ 2026-10-16 事故：script-src 曾漏放外部 CDN 域名，Supabase SDK 被浏览器拦截，
#    首页降级成「账号功能未启用」。现 SDK 已自托管到 /vendor/（同源），CSP 无需放行 CDN；
#    仅额外放行百度统计 hm.baidu.com（script/img/connect 三处）。改 CSP 后必须线上实测。
# =====================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' https://hm.baidu.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://hm.baidu.com; connect-src 'self' https://*.supabase.co https://hm.baidu.com; font-src 'self' data:"

# 后台页额外禁止被搜索引擎收录（robots.txt 只是「请求遵守」，
# 这里与 admin.html 里的 <meta name="robots"> 形成双保险）。
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
