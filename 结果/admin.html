<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>平仄查询站 · 管理后台</title>
  <style>
    :root {
      --bg: #f5f7fa; --panel: #ffffff; --line: #e2e8f0; --text: #1e293b;
      --muted: #64748b; --brand: #4f46e5; --brand-hover: #4338ca;
      --ok: #059669; --warn: #d97706; --err: #dc2626;
      --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 1px 2px rgba(15, 23, 42, .04);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      min-height: 100vh;
    }
    header {
      background: var(--panel); padding: 16px 28px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      box-shadow: var(--shadow);
    }
    header h1 { font-size: 17px; margin: 0; font-weight: 600; }
    header .meta { color: var(--muted); font-size: 13px; }
    .head-right { display: flex; align-items: center; gap: 14px; }
    .wrap { max-width: 1080px; margin: 28px auto; padding: 0 20px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 24px; box-shadow: var(--shadow);
    }
    .card.login { max-width: 380px; margin: 8vh auto; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: #fff; color: var(--text); font-size: 14px; margin-bottom: 14px;
    }
    input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79, 70, 229, .12); }
    button {
      cursor: pointer; border: none; border-radius: 8px; padding: 10px 16px;
      font-size: 14px; font-weight: 600; background: var(--brand); color: #fff;
      transition: background .15s;
    }
    button:hover { background: var(--brand-hover); }
    button:disabled { opacity: .6; cursor: default; }
    button.ghost { background: #fff; border: 1px solid var(--line); color: var(--text); }
    button.ghost:hover { background: #f1f5f9; }
    .tip { font-size: 13px; margin-top: 6px; min-height: 18px; color: var(--muted); }
    .tip.err { color: var(--err); }
    .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; background: #f8fafc; }
    td { white-space: nowrap; }
    tr:hover td { background: #f8fafc; }
    .ok { color: var(--ok); } .warn { color: var(--warn); }
    .muted { color: var(--muted); }
    code { background: #f1f5f9; padding: 1px 6px; border-radius: 4px; font-size: 12px; color: #475569; }

    /* 会员徽章与倒计时 */
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 999px;
      font-size: 12px; font-weight: 600; line-height: 1.6;
    }
    .badge.member { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .badge.free { background: #f1f5f9; color: #64748b; border: 1px solid var(--line); }
    /* 剩余天数：≥5 天正常色；<5 天红色醒目 */
    .days-ok { color: var(--ok); font-weight: 600; }
    .days-near { color: var(--err); font-weight: 700; }
    .days-expired { color: var(--err); font-weight: 700; }
    .tier-select {
      padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line);
      background: #fff; color: var(--text); font-size: 13px; cursor: pointer;
    }
    .tier-select:focus { outline: none; border-color: var(--brand); }
  </style>
</head>
<body>
  <header>
    <h1>平仄格律查询站 · 管理后台</h1>
    <div class="head-right">
      <span class="meta" id="adminMeta"></span>
      <button id="adminLogoutTop" class="ghost" style="display:none;">退出登录</button>
    </div>
  </header>

  <div class="wrap">
    <!-- 登录卡片 -->
    <div class="card login" id="adminLogin">
      <h2 style="margin:0 0 16px;font-size:16px;">管理员登录</h2>
      <p class="muted" style="font-size:13px;margin:0 0 16px;">
        仅限项目管理员账号。请用 Supabase 项目内的管理员邮箱登录。
      </p>
      <label for="adminEmail">邮箱</label>
      <input id="adminEmail" type="email" autocomplete="username" placeholder="admin@example.com" />
      <label for="adminPassword">密码</label>
      <input id="adminPassword" type="password" autocomplete="current-password" placeholder="••••••••" />
      <button id="adminSubmit" style="width:100%;">登　录</button>
      <div class="tip" id="adminTip"></div>
    </div>

    <!-- 数据面板 -->
    <div class="card" id="adminDash" style="display:none;">
      <div class="bar">
        <button id="adminRefresh" class="ghost">刷新</button>
        <button id="adminLogout" class="ghost">退出登录</button>
        <span class="muted" style="font-size:13px;margin-left:auto;">
          数据来自 <code>auth.users</code> 与各业务表的实时聚合
        </span>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>邮箱</th>
              <th>等级</th>
              <th>会员倒计时</th>
              <th>注册时间</th>
              <th>最近登录</th>
              <th>确认状态</th>
              <th>来源</th>
              <th>分析次数</th>
              <th>API 调用</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="userRows">
            <tr><td colspan="10" class="muted">载入中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 依赖顺序：supabase UMD → supabase-config.js → admin.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
